<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GT’s Candy Carnage — the Halloween candy bracket</title>
<meta name="description" content="64 Halloween candies, four regions, one champion. Pick the one you’d keep. The other one explodes.">
<meta property="og:title" content="GT’s Candy Carnage">
<meta property="og:description" content="64 Halloween candies, four regions, one champion. Pick the one you’d keep. The other one explodes.">
<meta name="theme-color" content="#140B26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍬%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9F8; --bg2:#E2D8F3; --surface:#FFFFFF; --ink:#1E1236; --muted:#5E5373;
  --a:#D85A00; --b:#5B3FD0; --line:rgba(30,18,54,.14); --track:rgba(30,18,54,.08);
  --moon:rgba(91,63,208,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140B26; --bg2:#1F1238; --surface:#251843; --ink:#F6EEDD; --muted:#B4A8C9;
    --a:#FF7A1A; --b:#B9A7FF; --line:rgba(246,238,221,.13); --track:rgba(246,238,221,.08);
    --moon:rgba(185,167,255,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140B26; --bg2:#1F1238; --surface:#251843; --ink:#F6EEDD; --muted:#B4A8C9;
  --a:#FF7A1A; --b:#B9A7FF; --line:rgba(246,238,221,.13); --track:rgba(246,238,221,.08);
  --moon:rgba(185,167,255,.14);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);
  background:radial-gradient(120% 60% at 50% -10%,var(--moon),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 40px}
:focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-family:var(--display);font-size:14px;line-height:1.1;letter-spacing:.02em;background:none;border:0;padding:4px 0;text-align:left}
.top-r{display:flex;gap:8px;flex:none}
.navlink{background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(54px,17vw,92px);line-height:.86;margin:0 0 18px;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--a);transform:translateX(.35em)}
.hero h1 .l0{font-size:.34em;color:var(--b);margin-bottom:.14em;letter-spacing:.03em}
.hero p{font-size:18px;line-height:1.45;margin:0 0 22px;max-width:30ch;color:var(--muted)}
.drop span{animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.drop .l2{animation-delay:.12s}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-4deg)}}
.drop .l2{animation-name:drop2}
@keyframes drop2{from{opacity:0;transform:translate(.35em,-40px) rotate(4deg)}}
.now{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;margin:0 0 14px;border:1px solid var(--line)}
.now .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 25%,transparent);background:var(--rc)}
.now small{display:block;color:var(--muted);font-size:13px}
.now strong{font-size:18px}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:18px;font-family:var(--display);font-size:20px;background:var(--a);color:#1A0E06;box-shadow:0 6px 0 color-mix(in srgb,var(--a) 55%,#000)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--a) 55%,#000)}
.cta[disabled]{opacity:.5;cursor:default}
.ghost{display:block;width:100%;margin-top:12px;background:none;border:1.5px solid var(--line);border-radius:18px;padding:15px;font-weight:600;font-size:16px}
.sched{list-style:none;padding:0;margin:28px 0 0;border-top:1px solid var(--line)}
.sched li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.sched .sw{width:10px;height:28px;border-radius:4px;background:var(--rc);flex:none}
.sched .nm{flex:1;font-weight:600}
.sched .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.sched .st{font-size:13px;color:var(--muted)}
.sched .st.on{color:var(--ink);font-weight:800}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin:18px 2px 0}

/* voting */
.vhead{margin:0 0 14px}
.vhead .rg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.vhead .rg i{width:10px;height:10px;border-radius:3px;background:var(--rc)}
.vhead .rd{font-family:var(--display);font-size:26px;line-height:1.05;margin:4px 0 10px}
.prog{height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.prog b{display:block;height:100%;background:var(--rc);border-radius:6px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.vhead .pk{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border:0;background:var(--surface);border-radius:24px;padding:10px 10px 14px;text-align:center;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--side) 45%,transparent),0 14px 30px -18px color-mix(in srgb,var(--side) 70%,transparent);
  touch-action:manipulation;will-change:transform}
.card.a{--side:var(--a)} .card.b{--side:var(--b)}
.card:active{transform:scale(.97)}
.plate{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--cc) 38%,transparent),transparent 68%),var(--bg2)}
.plate svg{width:88%;height:88%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.plate img{width:100%;height:100%;object-fit:cover}
.seed{position:absolute;top:8px;left:8px;min-width:30px;height:30px;padding:0 7px;border-radius:10px;display:grid;place-items:center;
  font-family:var(--display);font-size:14px;background:var(--side);color:var(--bg);z-index:2}
.cname{font-family:var(--display);font-size:15px;line-height:1.12;margin:12px 2px 0;min-height:2.24em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.vs{position:absolute;left:50%;top:calc(50% - 30px);transform:translate(-50%,-50%);z-index:3;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--ink);color:var(--bg);box-shadow:0 0 0 5px var(--bg);pointer-events:none}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-10deg) scale(.4);opacity:0;z-index:4;
  font-family:var(--display);font-size:18px;padding:6px 12px;border:3px solid currentColor;border-radius:10px;color:var(--side);background:var(--surface);pointer-events:none}

.tape{margin:18px 0 0;background:var(--surface);border-radius:20px;padding:12px 14px 6px;border:1px solid var(--line)}
.trow{padding:6px 0 8px}
.tlabel{text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.tbar{display:grid;grid-template-columns:28px 1fr 1fr 28px;gap:4px;align-items:center}
.tbar b{font-family:var(--display);font-size:16px;font-weight:400;text-align:center;color:var(--muted)}
.tbar b.hi{color:var(--ink)}
.half{height:12px;background:var(--track);border-radius:6px;overflow:hidden;display:flex}
.half.l{justify-content:flex-end}
.half i{display:block;height:100%;width:calc(var(--v)*100%);border-radius:6px;opacity:.45;transition:width .7s cubic-bezier(.3,1.2,.5,1) .25s}
.half.l i{background:var(--a)} .half.r i{background:var(--b)}
.half i.hi{opacity:1}
.half i.zero{width:0}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.4}
.tapnote{text-align:center;font-weight:800;font-size:16px;margin:16px 0 0}
.status{text-align:center;font-size:13px;color:var(--muted);margin-top:10px;min-height:1.2em}

/* animations */
.enter .card.a{animation:inL .55s cubic-bezier(.2,1.3,.4,1) both}
.enter .card.b{animation:inR .55s cubic-bezier(.2,1.3,.4,1) .06s both}
.enter .vs{animation:pop .45s cubic-bezier(.2,1.6,.4,1) .3s both}
@keyframes inL{from{opacity:0;transform:translateX(-80%) rotate(-12deg)}}
@keyframes inR{from{opacity:0;transform:translateX(80%) rotate(12deg)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(0)}}
.card.boom{animation:boom .42s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
@keyframes boom{
  0%{transform:none}
  15%{transform:translateX(-6px) rotate(-3deg)}
  30%{transform:translateX(6px) rotate(3deg) scale(1.04)}
  55%{transform:scale(1.14);filter:brightness(2) saturate(1.6);opacity:1}
  100%{transform:scale(.15) rotate(18deg);filter:brightness(3) blur(6px);opacity:0}
}
.card.win{animation:win .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes win{50%{transform:translateY(-10px) scale(1.04)}100%{transform:translateY(-4px) scale(1.02)}}
.card.win .stamp{animation:stamp .35s cubic-bezier(.2,1.8,.4,1) .2s forwards}
@keyframes stamp{to{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
.leave .arena{animation:leave .3s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateY(-24px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,255,255,.65),transparent 40%);animation:flash .35s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.banner{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s both}
.banner div{text-align:center;padding:24px}
.banner small{display:block;font-weight:800;color:var(--muted);margin-bottom:8px;font-size:15px}
.banner strong{display:block;font-family:var(--display);font-weight:400;font-size:clamp(40px,13vw,64px);line-height:.95;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.2);opacity:0}}
@keyframes fade{from{opacity:0}}

.champ{text-align:center;padding:10px 0}
.champ .card{max-width:240px;margin:6px auto 0;display:block;width:100%;cursor:default;--side:var(--a)}
.champ h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:4px 0 6px}
.champ p{color:var(--muted);margin:0 0 20px;font-size:16px;line-height:1.45}

/* bracket */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.tab i{width:9px;height:9px;border-radius:3px;background:var(--rc)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bh h2{font-family:var(--display);font-weight:400;font-size:28px;margin:8px 0 2px;line-height:1.05}
.bh p{margin:0 0 14px;color:var(--muted);font-size:15px}
.round h3{font-size:15px;font-weight:800;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.round h3 span{font-weight:400;color:var(--muted);font-size:13px}
.match{background:var(--surface);border-radius:16px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:34px 22px 1fr auto;gap:8px;align-items:center;padding:4px 0;position:relative}
.mrow .mini{width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.mrow .mini svg{width:92%;height:92%}
.mrow .mini img{width:100%;height:100%;object-fit:cover}
.mrow .sd{font-family:var(--display);font-size:12px;color:var(--muted);text-align:center}
.mrow .nm{font-size:15px;line-height:1.2;color:var(--muted)}
.mrow .ct{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow.w .nm{color:var(--ink);font-weight:800}
.mrow.w .ct{color:var(--ink);font-weight:800}
.mbar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin:4px 0 2px;display:flex}
.mbar i{display:block;height:100%}
.mnote{font-size:12px;color:var(--muted);margin-top:4px}
.crown{margin:24px 0 6px;text-align:center;background:var(--surface);border-radius:22px;padding:18px;border:2px solid var(--rc)}
.crown small{display:block;color:var(--muted);font-weight:600}
.crown strong{display:block;font-family:var(--display);font-weight:400;font-size:24px;margin-top:4px}
.empty{background:var(--surface);border-radius:18px;padding:18px;color:var(--muted);line-height:1.45;border:1px dashed var(--line)}

/* admin */
.sect{margin:26px 0 0}
.sect h2{font-size:18px;margin:0 0 4px}
.sect > p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:600;text-align:left;display:flex;gap:8px;align-items:center}
.seg button i{width:10px;height:10px;border-radius:3px;background:var(--rc);flex:none}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .mini{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.prow .mini svg{width:90%;height:90%}
.prow .mini img{width:100%;height:100%;object-fit:cover}
.prow .acts{display:flex;gap:6px}
.sbtn{border:1.5px solid var(--line);background:none;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.field{display:block;width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin:0 0 12px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.counts div{background:var(--surface);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.counts strong{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.counts span{font-size:13px;color:var(--muted)}
.dialog{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,5,20,.55);padding:20px;animation:fade .15s both}
.dialog > div{background:var(--surface);border-radius:22px;padding:20px;max-width:420px;width:100%}
.dialog h3{margin:0 0 8px;font-size:19px}
.dialog p{margin:0 0 12px;color:var(--muted);line-height:1.45}
.dialog ol{margin:0 0 16px;padding-left:22px;line-height:1.6;font-weight:600}
.dialog .row{display:flex;gap:10px}
.dialog .row button{flex:1;border-radius:14px;padding:13px;font-weight:800;border:1.5px solid var(--line);background:none}
.dialog .row button.go{background:var(--a);color:#1A0E06;border-color:var(--a)}

/* whole bracket */
.wrap.wide{max-width:1240px}
.pzbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 8px}
.pzbar .sbtn{min-width:42px;font-size:15px;background:var(--surface)}
.vp{position:relative;height:min(74vh,780px);overflow:hidden;touch-action:none;border-radius:22px;background:var(--surface);border:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none}
.vp:active{cursor:grabbing}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.blines{position:absolute;left:0;top:0;pointer-events:none}
.blines path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.6}
.bs{position:absolute;height:17px;display:flex;align-items:baseline;gap:5px;font-size:11.5px;line-height:17px;white-space:nowrap;overflow:hidden;color:var(--ink);pointer-events:none}
.bs span{overflow:hidden;text-overflow:ellipsis}
.bs b{font-family:var(--display);font-weight:400;font-size:9px;color:var(--muted);flex:none}
.bs.R{flex-direction:row-reverse;text-align:right}
.bs.w span{font-weight:800}
.bs.l{color:var(--muted)}
.bzone{position:absolute;border-radius:18px;background:color-mix(in srgb,var(--rc) 8%,transparent)}
.blabel{position:absolute;transform:translateY(-50%);border:0;background:none;padding:6px 4px;font-family:var(--display);font-size:13px;line-height:1.1;text-align:left;color:var(--ink)}
.blabel.R{text-align:right}
.blabel i{display:block;width:22px;height:5px;border-radius:3px;background:var(--rc);margin-bottom:6px}
.blabel.R i{margin-left:auto}
.blabel small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);margin-top:4px;text-decoration:underline;text-underline-offset:2px}
.btitle{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:var(--display);font-size:26px;pointer-events:none}
.bhd{position:absolute;top:36px;font-size:11px;font-weight:800;color:var(--muted);pointer-events:none;padding:0 4px}
.bhd.R{text-align:right}
.bchamp{position:absolute;width:190px;height:100px;border-radius:18px;border:2px solid var(--a);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:6px}
.bchamp small{font-size:11px;font-weight:800;color:var(--muted)}
.bchamp strong{font-family:var(--display);font-weight:400;font-size:14px;line-height:1.1}
.bchamp .tbd{color:var(--muted);font-size:13px}
.bchamp .mini{width:38px;height:38px;border-radius:9px;overflow:hidden;display:grid;place-items:center}
.bchamp .mini svg,.bchamp .mini img{width:100%;height:100%;object-fit:cover}
.bf4{position:absolute;text-align:center;font-family:var(--display);font-size:13px;color:var(--muted);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ------------------------------------------------------------------ data */
const REGIONS = [
  {id:"chocolate", name:"Chocolate Crypt",   short:"Chocolate",             color:"#A8683A"},
  {id:"fruity",    name:"Chewy Cauldron",    short:"Fruity & chewy",        color:"#FF4D6D"},
  {id:"sour",      name:"Sour Swamp",        short:"Sour & gummy",          color:"#8FD14F"},
  {id:"oddball",   name:"Oddball Graveyard", short:"Hard candy & oddballs", color:"#FFC24A"},
];
const FINAL = {id:"final", name:"Final Four", short:"Region champions", color:"#FF7A1A"};
const STAGES = [...REGIONS, FINAL];
const stageById = id => STAGES.find(s => s.id === id);

// [id, name, seed, sweetness, savory, swap value, shape, colors]
const RAW = {

/* ------------------------------------------------------------------ bracket logic */
function entrantsFor(stage){
  if (stage === "final") return S.stage.finalists || null;
  return regionOrder(stage);
}
// Replays a list of winners through the bracket. Returns played matches and the next matchup.
function replay(entrants, w){
  let field = entrants.slice(), round = 0, k = 0; const matches = [];
  while (field.length > 1){
    const next = [];
    for (let i = 0; i < field.length; i += 2){
      const a = field[i], b = field[i+1];
      if (k < w.length){
        const win = w[k];
        if (win !== a && win !== b) return {matches, current:null, broken:true};
        matches.push({round, a, b, w:win}); next.push(win); k++;
      } else {
        return {matches, current:{round, a, b, pick:k, total:entrants.length - 1}};
      }
    }
    field = next; round++;
  }
  return {matches, current:null, champion:field[0]};
}
function myStage(stage){
  const e = entrantsFor(stage); if (!e) return null;
  let st = S.mine.stages[stage];
  if (!st || (stage === "final" && JSON.stringify(st.e) !== JSON.stringify(e))) st = {w:[]};
  if (replay(e, st.w).broken) st = {w:[]};
  if (stage === "final") st.e = e.slice();
  S.mine.stages[stage] = st;
  return st;
}
function allBallots(){
  if (S.practice) return [{id:"me", data:S.mine}];
  return S.ballots;
}
function aggregate(stage){
  const entrants = entrantsFor(stage); if (!entrants) return null;
  const h2h = {}, rec = {}; let voters = 0;
  const key = (a,b) => a < b ? a + "|" + b : b + "|" + a;
  for (const b of allBallots()){
    const st = b.data && b.data.stages && b.data.stages[stage];
    if (!st || !Array.isArray(st.w) || !st.w.length) continue;
    if (stage === "final" && JSON.stringify(st.e) !== JSON.stringify(entrants)) continue;
    const r = replay(entrants, st.w.filter(x => typeof x === "string"));
    if (!r.matches.length) continue;
    voters++;
    for (const m of r.matches){
      const k = key(m.a, m.b); h2h[k] = h2h[k] || {}; h2h[k][m.w] = (h2h[k][m.w] || 0) + 1;
      for (const id of [m.a, m.b]){ rec[id] = rec[id] || {w:0, g:0}; rec[id].g++; }
      rec[m.w].w++;
    }
  }
  const rate = id => rec[id] && rec[id].g ? rec[id].w / rec[id].g : -1;
  let field = entrants.slice(); const rounds = [];
  while (field.length > 1){
    const ms = [], next = [];
    for (let i = 0; i < field.length; i += 2){
      const a = field[i], b = field[i+1], h = h2h[key(a,b)] || {};
      const va = h[a] || 0, vb = h[b] || 0; let w, how;
      if (va !== vb){ w = va > vb ? a : b; how = "votes"; }
      else if (rate(a) !== rate(b)){ w = rate(a) > rate(b) ? a : b; how = va + vb ? "tie" : "rate"; }
      else { w = CANDY[a].seed <= CANDY[b].seed ? a : b; how = va + vb ? "tieseed" : "seed"; }
      ms.push({a, b, va, vb, w, how}); next.push(w);
    }
    rounds.push(ms); field = next;
  }
  return {voters, rounds, champion:field[0]};
}
const computeFinalists = () => REGIONS.map(r => aggregate(r.id).champion);

/* ------------------------------------------------------------------ saving */
let saving = false, again = false;
async function saveMine(){
  if (S.practice || !S.db || !S.uid) return;
  if (saving){ again = true; return; }
  saving = true; setStatus("Saving…");
  const body = JSON.parse(JSON.stringify(S.mine)); body.t = Date.now();
  try {
    await S.db.doc("ballots/" + S.uid).set(body);
    setStatus("Vote saved");
  } catch (e) {
    if (e && e.code === "unavailable"){
      await new Promise(r => setTimeout(r, 600 + Math.random()*900));
      try { await S.db.doc("ballots/" + S.uid).set(body); setStatus("Vote saved"); }
      catch { setStatus("Your last pick didn’t save. It will save with your next pick."); }
    } else if (e && e.code === "permission-denied"){
      S.practice = true; S.practiceWhy = "readonly";
      setStatus("You can play, but your votes aren’t being counted.");
    } else if (e && e.code === "resource-exhausted"){
      setStatus("The bracket hit its daily limit. Try again tomorrow.");
    } else setStatus("Your last pick didn’t save. It will save with your next pick.");
  }
  saving = false;
  if (again){ again = false; saveMine(); }
}
function setStatus(t){ S.save = t; const el = document.getElementById("status"); if (el) el.textContent = t; }

const cvs = document.getElementById("fx"), ctx = cvs.getContext("2d"); let parts = [], rings = [], raf = 0;

addEventListener("resize", sizeFx); sizeFx();
function explode(x, y, colors){
  const pal = [...colors, "#FFFFFF", "#FFE9A8"];

    const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*10;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 3, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.5,
      s:3 + Math.random()*8, c:pal[i % pal.length], life:0, max:55 + Math.random()*40, kind:Math.random() < .55 ? 0 : Math.random() < .5 ? 1 : 2});

    ctx.restore();
  }

  if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
}

function sfxBoom(){
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * .55), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);

  for (let i = 0; i < 5; i++) tone(a, "square", 1800 + Math.random() * 2200, 1200, .06 + i * .045, .05, .035);

/* ------------------------------------------------------------------ whole-bracket overview */
const BX = {W:120, S:22, PAD:20, TOPS:[60, 464], BW:1580};

const BX_SIDE = {chocolate:["L",0], fruity:["L",1], sour:["R",0], oddball:["R",1]};
const bxX = (side, r) => { const a = BX.PAD + r * BX.W, b = a + BX.W; return side === "L" ? [a, b] : [BX.BW - b, BX.BW - a]; };

function bxRect(id){

    <div class="bh"><h2>The whole bracket</h2><p>${S.practice ? "Showing your own picks only. " : ""}Pinch or scroll to zoom and drag to move around. Tap a region to zoom in, or its name to see every matchup with votes.</p></div>

const PZ = {s:1, x:0, y:0, min:.1, max:3, ready:false, active:false, dirty:false};
function pzApply(anim){
  const el = document.getElementById("sheet"); if (!el) return;
  el.style.transition = anim && !reduce ? "transform .35s cubic-bezier(.3,1,.4,1)" : "none";
  el.style.transform = `translate(${PZ.x}px,${PZ.y}px) scale(${PZ.s})`;
}
function pzClamp(){

  const vw = vp.clientWidth, vh = vp.clientHeight;
  PZ.s = Math.min(PZ.max, Math.max(PZ.min, PZ.s));
  PZ.x = Math.min(vw * .6, Math.max(vw * .4 - BX.BW * PZ.s, PZ.x));
  PZ.y = Math.min(vh * .6, Math.max(vh * .4 - BX.BH * PZ.s, PZ.y));
}
function pzFit(rect, anim){
  const vp = document.getElementById("vp"); if (!vp) return;

  const s = Math.min(vw / rw, vh / rh) * .96;

const zoomTo = id => pzFit(bxRect(id), true);
function initOverview(){

  try { firebase.initializeApp(cfg); auth = firebase.auth(); S.db = firebase.firestore(); }
  catch { S.db = null; S.practiceWhy = "setup"; render(); return; }
  try { S.canEdit = localStorage.getItem("gtcc-admin") === "1"; } catch {}

  const timer = setTimeout(() => { if (!S.cfgLoaded){ S.liveNote = "Live results can’t be reached yet. They’ll appear when the connection comes back."; if (!S.busy) render(); } }, 10000);
  S.db.doc("config/stage").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    const next = d && typeof d.open === "string" ? {open:d.open, finalists:Array.isArray(d.finalists) && d.finalists.length === 4 && d.finalists.every(x => CANDY[x]) ? d.finalists : null} : {open:"chocolate", finalists:null};
    const changed = next.open !== S.stage.open || JSON.stringify(next.finalists) !== JSON.stringify(S.stage.finalists);
    S.stage = next;
    if (!snap.metadata.fromCache){ S.cfgLoaded = true; clearTimeout(timer); S.liveNote = ""; }
    if (changed && !S.busy && !PZ.active) render();
  }, () => { clearTimeout(timer); S.liveNote = "The bracket settings can’t be loaded. If you set this up, check that the Firestore rules from SETUP.md are published."; if (!S.busy) render(); });

  // each phone or browser gets an anonymous ID, so one ballot per device
  try { const cred = await auth.signInAnonymously(); S.uid = cred.user.uid; }
  catch (e) { S.practiceWhy = e && e.code === "auth/operation-not-allowed" ? "noanon" : "offline"; if (!S.busy) render(); return; }

  try {
    const mine = await Promise.race([S.db.doc("ballots/" + S.uid).get(), wait(8000).then(() => { throw {code:"timeout"}; })]);
    const d = mine.exists ? mine.data() : null;
    const local = S.mine; // picks made before the connection was ready
    S.mine = d && d.stages && typeof d.stages === "object" ? JSON.parse(JSON.stringify(d)) : {stages:{}};
    for (const [k, v] of Object.entries(local.stages)) if (v.w && v.w.length && !(S.mine.stages[k] && S.mine.stages[k].w && S.mine.stages[k].w.length)) S.mine.stages[k] = v;
    S.practice = false; S.mineLoaded = true;
    if (Object.values(local.stages).some(v => v.w && v.w.length)) saveMine();
  } catch (e) {
    S.practiceWhy = e && e.code === "permission-denied" ? "rules" : "loading";
  }
  if (!S.busy && !PZ.active) render();
})();
</script>
