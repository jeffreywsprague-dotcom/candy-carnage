<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GT’s Candy Carnage — the Halloween candy bracket</title>
<meta name="description" content="64 Halloween candies, four regions, one champion. Pick the one you’d keep. The other one explodes.">
<meta property="og:title" content="GT’s Candy Carnage">
<meta property="og:description" content="64 Halloween candies, four regions, one champion. Pick the one you’d keep. The other one explodes.">
<meta name="theme-color" content="#140B26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍬%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9F8; --bg2:#E2D8F3; --surface:#FFFFFF; --ink:#1E1236; --muted:#5E5373;
  --a:#D85A00; --b:#5B3FD0; --line:rgba(30,18,54,.14); --track:rgba(30,18,54,.08);
  --moon:rgba(91,63,208,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140B26; --bg2:#1F1238; --surface:#251843; --ink:#F6EEDD; --muted:#B4A8C9;
    --a:#FF7A1A; --b:#B9A7FF; --line:rgba(246,238,221,.13); --track:rgba(246,238,221,.08);
    --moon:rgba(185,167,255,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140B26; --bg2:#1F1238; --surface:#251843; --ink:#F6EEDD; --muted:#B4A8C9;
  --a:#FF7A1A; --b:#B9A7FF; --line:rgba(246,238,221,.13); --track:rgba(246,238,221,.08);
  --moon:rgba(185,167,255,.14);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);
  background:radial-gradient(120% 60% at 50% -10%,var(--moon),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 40px}
:focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-family:var(--display);font-size:14px;line-height:1.1;letter-spacing:.02em;background:none;border:0;padding:4px 0;text-align:left}
.top-r{display:flex;gap:8px;flex:none}
.navlink{background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(54px,17vw,92px);line-height:.86;margin:0 0 18px;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--a);transform:translateX(.35em)}
.hero h1 .l0{font-size:.34em;color:var(--b);margin-bottom:.14em;letter-spacing:.03em}
.hero p{font-size:18px;line-height:1.45;margin:0 0 22px;max-width:30ch;color:var(--muted)}
.drop span{animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.drop .l2{animation-delay:.12s}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-4deg)}}
.drop .l2{animation-name:drop2}
@keyframes drop2{from{opacity:0;transform:translate(.35em,-40px) rotate(4deg)}}
.now{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;margin:0 0 14px;border:1px solid var(--line)}
.now .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 25%,transparent);background:var(--rc)}
.now small{display:block;color:var(--muted);font-size:13px}
.now strong{font-size:18px}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:18px;font-family:var(--display);font-size:20px;background:var(--a);color:#1A0E06;box-shadow:0 6px 0 color-mix(in srgb,var(--a) 55%,#000)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--a) 55%,#000)}
.cta[disabled]{opacity:.5;cursor:default}
.ghost{display:block;width:100%;margin-top:12px;background:none;border:1.5px solid var(--line);border-radius:18px;padding:15px;font-weight:600;font-size:16px}
.sched{list-style:none;padding:0;margin:28px 0 0;border-top:1px solid var(--line)}
.sched li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.sched .sw{width:10px;height:28px;border-radius:4px;background:var(--rc);flex:none}
.sched .nm{flex:1;font-weight:600}
.sched .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.sched .st{font-size:13px;color:var(--muted)}
.sched .st.on{color:var(--ink);font-weight:800}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin:18px 2px 0}

/* voting */
.vhead{margin:0 0 14px}
.vhead .rg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.vhead .rg i{width:10px;height:10px;border-radius:3px;background:var(--rc)}
.vhead .rd{font-family:var(--display);font-size:26px;line-height:1.05;margin:4px 0 10px}
.prog{height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.prog b{display:block;height:100%;background:var(--rc);border-radius:6px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.vhead .pk{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border:0;background:var(--surface);border-radius:24px;padding:10px 10px 14px;text-align:center;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--side) 45%,transparent),0 14px 30px -18px color-mix(in srgb,var(--side) 70%,transparent);
  touch-action:manipulation;will-change:transform}
.card.a{--side:var(--a)} .card.b{--side:var(--b)}
.card:active{transform:scale(.97)}
.plate{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--cc) 38%,transparent),transparent 68%),var(--bg2)}
.plate svg{width:88%;height:88%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.plate img{width:100%;height:100%;object-fit:cover}
.seed{position:absolute;top:8px;left:8px;min-width:30px;height:30px;padding:0 7px;border-radius:10px;display:grid;place-items:center;
  font-family:var(--display);font-size:14px;background:var(--side);color:var(--bg);z-index:2}
.cname{font-family:var(--display);font-size:15px;line-height:1.12;margin:12px 2px 0;min-height:2.24em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.vs{position:absolute;left:50%;top:calc(50% - 30px);transform:translate(-50%,-50%);z-index:3;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--ink);color:var(--bg);box-shadow:0 0 0 5px var(--bg);pointer-events:none}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-10deg) scale(.4);opacity:0;z-index:4;
  font-family:var(--display);font-size:18px;padding:6px 12px;border:3px solid currentColor;border-radius:10px;color:var(--side);background:var(--surface);pointer-events:none}

.tape{margin:18px 0 0;background:var(--surface);border-radius:20px;padding:12px 14px 6px;border:1px solid var(--line)}
.trow{padding:6px 0 8px}
.tlabel{text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.tbar{display:grid;grid-template-columns:28px 1fr 1fr 28px;gap:4px;align-items:center}
.tbar b{font-family:var(--display);font-size:16px;font-weight:400;text-align:center;color:var(--muted)}
.tbar b.hi{color:var(--ink)}
.half{height:12px;background:var(--track);border-radius:6px;overflow:hidden;display:flex}
.half.l{justify-content:flex-end}
.half i{display:block;height:100%;width:calc(var(--v)*100%);border-radius:6px;opacity:.45;transition:width .7s cubic-bezier(.3,1.2,.5,1) .25s}
.half.l i{background:var(--a)} .half.r i{background:var(--b)}
.half i.hi{opacity:1}
.half i.zero{width:0}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:14px 0
